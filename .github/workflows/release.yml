name: Trigger Deploy and Release

on:
  push:
    branches:
      - main # Triggers whenever you push or merge code to the main branch

permissions:
  contents: write # Allows GitHub to automatically create the Release UI

jobs:
  release-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # This triggers your Cloudflare Pages build using your secret hook
      - name: Trigger Cloudflare Pages Deployment
        run: |
          curl -d "" "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"

      # Creates a new release using the unique GitHub run number as the tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r${{ github.run_number }}
          name: Release Build #${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
