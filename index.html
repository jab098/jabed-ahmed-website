      property="og:description"
      content="Tag management, server-side tracking, CRO and privacy-compliant data pipelines for global digital products."
    />
    <title>Jabed Ahmed</title>
    <style>
      html.is-loading,
      html.is-loading body,
      html.is-loading #root {
        min-height: 100%;
        background: #ff5a1f;
        overflow: hidden;
      }
    </style>
    <script>
      history.scrollRestoration = 'manual'
      if (location.hash) history.replaceState(null, '', location.pathname + location.search)
      document.documentElement.classList.add('is-loading')
      scrollTo(0, 0)
      addEventListener('beforeunload', () => scrollTo(0, 0))
      addEventListener('pageshow', () => scrollTo(0, 0))
      window.__loaderFallback = setTimeout(() => {
        document.documentElement.classList.remove('is-loading')
        document.documentElement.classList.add('loader-complete')
      }, 7000)
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
